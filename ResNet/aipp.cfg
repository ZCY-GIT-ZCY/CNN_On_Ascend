# AIPP 配置文件 - ImageNet 归一化参数
# 用于昇腾 ATC 转换时硬件预处理

aipp_op {
    aipp_mode: static
    input_format: 3                  # BGR888_U8 = 3
    src_image_size_w: 224            # 模型输入宽度
    src_image_size_h: 224            # 模型输入高度

    # ImageNet 归一化参数
    # 均值: [0.485, 0.456, 0.406]
    # 方差: [0.229, 0.224, 0.225]

    # BGR 通道顺序 (注意：BGR 对应 RGB，但顺序是 0=B, 1=G, 2=R)
    mean_chn_0: 104                  # B 通道均值 = 255 * 0.406 ≈ 104
    mean_chn_1: 116                  # G 通道均值 = 255 * 0.456 ≈ 116
    mean_chn_2: 124                  # R 通道均值 = 255 * 0.485 ≈ 124

    # 最小值（通常为 0）
    min_chn_0: 0.0
    min_chn_1: 0.0
    min_chn_2: 0.0

    # 方差倒数: 1 / (255 * std)
    var_reci_chn_0: 0.01712475       # 1 / (255 * 0.229)
    var_reci_chn_1: 0.01750700       # 1 / (255 * 0.224)
    var_reci_chn_2: 0.01742919       # 1 / (255 * 0.225)
}
